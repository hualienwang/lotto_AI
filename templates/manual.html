<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今彩539手動輸入開獎</title>
    <meta content="今彩539,手動輸入,開獎記錄" name="keywords" />
    <meta name="Description" content="手動輸入今彩539開獎號碼，方便記錄和管理開獎資料。" />
    <style>
      :root {
        --ink: #211f18;
        --muted: #756f61;
        --paper: #fffaf0;
        --panel: #fffdf7;
        --line: #ded3bb;
        --gold: #d5a23a;
        --red: #d84a3a;
        --green: #0d7c66;
        --shadow: 0 24px 70px rgba(33,31,24,.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background:
          linear-gradient(135deg, rgba(213,162,58,.18), transparent 34%),
          radial-gradient(circle at 88% 10%, rgba(216,74,58,.12), transparent 28%),
          var(--paper);
      }
      .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 56px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
      .brand { font: 700 18px/1 "Noto Serif TC", "PMingLiU", serif; }
      .nav { display: flex; flex-wrap: wrap; gap: 8px; }
      .nav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 9px 12px; background: rgba(255,255,255,.5); }
      .nav a.active, .nav a:hover { color: var(--ink); border-color: var(--gold); }
      .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: end; padding: 44px 0 28px; }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font: 800 clamp(38px, 7vw, 76px)/.98 "Noto Serif TC", "PMingLiU", serif; letter-spacing: 0; }
      .summary { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
      .panel { background: rgba(255,253,247,.86); border: 1px solid var(--line); box-shadow: var(--shadow); }
      form { padding: clamp(18px, 4vw, 34px); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
      label { display: grid; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 700; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 13px 14px;
        font: 600 16px/1.2 "Microsoft JhengHei", sans-serif;
        outline: none;
      }
      input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(13,124,102,.12); }
      .numbers { grid-column: 1 / -1; }
      .num-input { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
      button {
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        min-height: 46px;
        padding: 0 18px;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
      button:hover { transform: translateY(-1px); }
      #message { margin-top: 16px; padding: 13px 15px; display: none; border: 1px solid; font-weight: 700; }
      .hint { padding: 18px 22px; border-top: 1px solid var(--line); color: var(--muted); line-height: 1.8; background: rgba(255,250,240,.72); }
      @media (max-width: 780px) {
        .topbar, .hero { display: block; }
        .nav { margin-top: 14px; }
        .summary { margin-top: 16px; }
        .form-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">今彩539</div>
        <nav class="nav" aria-label="主功能">
          <a href="/history.html">歷史記錄</a>
          <a href="/predict.html">預測開獎</a>
          <a class="active" href="/manual.html">手動輸入</a>
        </nav>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">Manual Entry</p>
          <h1>補登開獎資料</h1>
        </div>
        <p class="summary">輸入期次、日期與五個開獎號碼。送出後會寫入本機資料庫，若期次已存在則更新該筆資料。</p>
      </section>

      <section class="panel">
        <form id="manualForm">
          <div class="form-grid">
            <label>
              期次
              <input id="period" maxlength="10" name="period" placeholder="例：115088" required />
            </label>
            <label>
              開獎日
              <input id="drawDate" type="date" name="drawDate" required />
            </label>
            <label>
              頭獎中獎注數
              <input id="prizeCount" type="number" inputmode="numeric" name="prizeCount" min="0" placeholder="例：2" />
            </label>
            <label class="numbers">
              開獎號碼
              <input class="num-input" id="numbersInput" inputmode="numeric" name="numbers" placeholder="例：01,02,03,04,05" required />
            </label>
          </div>
          <div class="actions">
            <button type="button" onclick="submitManual()">儲存開獎記錄</button>
            <button class="secondary" type="reset" onclick="setTimeout(initDefaults, 0)">重置</button>
          </div>
          <div id="message" role="status" aria-live="polite"></div>
        </form>
        <div class="hint">請用逗號分隔 5 個號碼；號碼會自動補零，例如輸入 7,12,3,28,39 會儲存為 07,12,03,28,39。</div>
      </section>
    </main>

    <script>
      function submitManual() {
        // 讀取表單資料並做最基本的前端格式整理。
        var period = document.getElementById('period').value.trim();
        var drawDate = document.getElementById('drawDate').value;
        var prizeCount = document.getElementById('prizeCount').value.trim();
        var values = document.getElementById('numbersInput').value
          .split(',')
          .map(function(value) { return value.trim(); })
          .filter(function(value) { return value !== ''; });
        if (values.length !== 5) {
          showMessage(false, '請輸入 5 個以逗號分隔的號碼');
          return;
        }
        if (!prizeCount || isNaN(prizeCount) || parseInt(prizeCount) < 0) {
          showMessage(false, '請輸入有效的頭獎中獎注數');
          return;
        }
        // 儲存前統一補成兩位數，讓歷史頁可以直接用 01-39 比對。
        values = values.map(function(value) { return value.padStart(2, '0'); });
        var numbers = values.join(',');

        // 寫入後端 /api/manual；後端用 INSERT OR REPLACE 讓同一期次可覆蓋修正。
        fetch('/api/manual', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({period: period, draw_date: drawDate, numbers: numbers, prize_count: parseInt(prizeCount)})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            showMessage(true, '開獎記錄已儲存成功');
            document.getElementById('manualForm').reset();
            initDefaults();
          } else {
            showMessage(false, '儲存失敗：' + data.message);
          }
        });
      }

      function initDefaults() {
        // 表單初始化：自動帶入下一期期次與今天日期。
        loadNextPeriod();
        setDefaultDrawDate();
      }

      function setDefaultDrawDate() {
        // 使用本地時區換算日期，避免 UTC 日期造成跨日誤差。
        var drawDateInput = document.getElementById('drawDate');
        if (drawDateInput.value) return;
        var today = new Date();
        var localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
          .toISOString()
          .slice(0, 10);
        drawDateInput.value = localToday;
      }

      function loadNextPeriod() {
        // 從後端取得目前資料庫最大期次 + 1；若使用者已輸入則不覆蓋。
        fetch('/api/next-period')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var periodInput = document.getElementById('period');
            if (periodInput.value.trim()) return;
            periodInput.value = String(data.next_period);
          });
      }

      function showMessage(success, text) {
        // 統一處理成功 / 失敗提示，3 秒後自動隱藏。
        var msg = document.getElementById('message');
        msg.style.backgroundColor = success ? '#eaf6ef' : '#fff0ee';
        msg.style.color = success ? '#126443' : '#9f2d22';
        msg.style.borderColor = success ? '#9ed4b6' : '#e7aea7';
        msg.textContent = text;
        msg.style.display = 'block';
        setTimeout(function() { msg.style.display = 'none'; }, 3000);
      }

      // 首次進入頁面即載入預設值。
      initDefaults();
    </script>
  </body>
</html>
