<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今彩539開獎系統</title>
    <style>
      :root {
        --ink: #202016;
        --muted: #6d6b5f;
        --paper: #fffaf0;
        --line: #dfd6bf;
        --gold: #d8a63c;
        --red: #d94a3a;
        --green: #0d7c66;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Serif TC", "PMingLiU", serif;
        background:
          linear-gradient(135deg, rgba(216,166,60,.14), transparent 35%),
          radial-gradient(circle at 80% 12%, rgba(217,74,58,.12), transparent 28%),
          var(--paper);
      }
      main {
        width: min(1040px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-content: center;
        gap: 28px;
        padding: 48px 0;
      }
      .mast {
        border-top: 5px solid var(--ink);
        border-bottom: 1px solid var(--line);
        padding: 28px 0 22px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font: 700 13px/1.2 "Microsoft JhengHei", sans-serif;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(44px, 8vw, 92px);
        line-height: .95;
        letter-spacing: 0;
      }
      .deck {
        max-width: 680px;
        margin: 16px 0 0;
        color: var(--muted);
        font: 17px/1.8 "Microsoft JhengHei", sans-serif;
      }
      .nav-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      a {
        min-height: 190px;
        color: inherit;
        text-decoration: none;
        border: 1px solid var(--line);
        background: rgba(255,255,255,.55);
        padding: 22px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }
      a:hover {
        transform: translateY(-4px);
        border-color: var(--gold);
        box-shadow: 0 18px 42px rgba(32,32,22,.12);
      }
      .mark {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        color: #fff;
        border-radius: 50%;
        background: var(--red);
        font: 700 18px/1 "Microsoft JhengHei", sans-serif;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font: 15px/1.7 "Microsoft JhengHei", sans-serif;
      }
      button#fetch-history-btn {
        margin-top: 24px;
        padding: 14px 22px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: 700 16px/1.3 "Microsoft JhengHei", sans-serif;
        cursor: pointer;
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }
      button#fetch-history-btn:hover {
        transform: translateY(-2px);
        border-color: var(--gold);
        box-shadow: 0 14px 30px rgba(32,32,22,.1);
      }
      button#fetch-history-btn:disabled {
        opacity: .55;
        cursor: not-allowed;
        transform: none;
      }
      .fetch-status {
        margin-top: 12px;
        color: var(--green);
        font: 15px/1.6 "Microsoft JhengHei", sans-serif;
      }
      @media (max-width: 760px) {
        main { align-content: start; }
        .nav-grid { grid-template-columns: 1fr; }
        a { min-height: 150px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="mast">
        <p class="eyebrow">Lotto 539 Console</p>
        <h1>今彩539<br>開獎系統</h1>
        <p class="deck">整理歷史開獎、手動補登資料，並快速產生參考預測號碼。</p>
        <button id="fetch-history-btn" type="button">抓取今彩539歷史資料</button>
        <p id="fetch-status" class="fetch-status" aria-live="polite"></p>
      </section>
      <nav class="nav-grid" aria-label="主功能">
        <a href="/history.html"><span class="mark">歷</span><span><h2>歷次開獎記錄</h2><p>查詢期次、號碼分布與開出次數排序。</p></span></a>
        <a href="/predict.html"><span class="mark">測</span><span><h2>預測開獎</h2><p>依不同分析模式產生 5 組參考號碼。</p></span></a>
        <a href="/manual.html"><span class="mark">錄</span><span><h2>手動輸入開獎</h2><p>新增或覆蓋指定期次的開獎資料。</p></span></a>
      </nav>
    </main>
    <script>
      const fetchBtn = document.getElementById('fetch-history-btn');
      const statusText = document.getElementById('fetch-status');

      fetchBtn.addEventListener('click', async () => {
        fetchBtn.disabled = true;
        statusText.textContent = '正在抓取歷史資料，請稍候...';

        try {
          const response = await fetch('/api/fetch-history', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
          });
          const result = await response.json();

          if (result.success) {
            statusText.textContent = result.message;
          } else {
            statusText.textContent = '抓取失敗：' + result.message;
          }
        } catch (error) {
          statusText.textContent = '伺服器連線失敗，請稍後再試。';
        } finally {
          fetchBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
