<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今彩539預測開獎</title>
    <meta content="今彩539,預測開獎,AI預測" name="keywords" />
    <meta name="Description" content="今彩539 AI智能預測開獎號碼，基於歷史數據分析提供參考號碼。" />
    <style>
      :root {
        --ink: #201f1a;
        --muted: #706b5e;
        --paper: #fffaf0;
        --panel: #fffdf7;
        --line: #ded3bb;
        --gold: #d7a43a;
        --red: #d94a3a;
        --green: #0c7b66;
        --blue: #305f89;
        --shadow: 0 24px 70px rgba(32,31,26,.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background:
          linear-gradient(135deg, rgba(215,164,58,.18), transparent 34%),
          radial-gradient(circle at 88% 10%, rgba(48,95,137,.14), transparent 28%),
          var(--paper);
      }
      .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 56px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
      .brand { font: 700 18px/1 "Noto Serif TC", "PMingLiU", serif; }
      .nav { display: flex; flex-wrap: wrap; gap: 8px; }
      .nav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 9px 12px; background: rgba(255,255,255,.5); }
      .nav a.active, .nav a:hover { color: var(--ink); border-color: var(--gold); }
      .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: end; padding: 44px 0 28px; }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font: 800 clamp(38px, 7vw, 76px)/.98 "Noto Serif TC", "PMingLiU", serif; letter-spacing: 0; }
      .summary { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
      .workspace { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 18px; align-items: start; }
      .panel { background: rgba(255,253,247,.88); border: 1px solid var(--line); box-shadow: var(--shadow); }
      .control { padding: 24px; display: grid; gap: 18px; }
      label { display: grid; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 800; }
      select {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 13px 14px;
        font: 700 16px/1.2 "Microsoft JhengHei", sans-serif;
        outline: none;
      }
      select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(12,123,102,.12); }
      button {
        min-height: 48px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        padding: 0 18px;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
      button:hover { transform: translateY(-1px); }
      .result { padding: 28px; min-height: 260px; display: none; }
      .result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      h2, h3 { margin: 0; font-family: "Noto Serif TC", "PMingLiU", serif; }
      .meta { color: var(--muted); font-size: 14px; }
      .balls { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0; }
      .ball {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        color: #fff;
        background: radial-gradient(circle at 34% 28%, #ff8878, var(--red) 62%, #a7271b);
        box-shadow: inset -8px -10px 16px rgba(0,0,0,.18), 0 10px 20px rgba(217,74,58,.22);
        font: 900 22px/1 "Georgia", serif;
      }
      .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .detail { border-top: 3px solid var(--gold); background: rgba(255,250,240,.78); padding: 12px; }
      .detail span { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin-bottom: 5px; }
      .model-note { margin: -10px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .history { margin-top: 18px; overflow-x: auto; }
      .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      table { width: 100%; border-collapse: collapse; background: rgba(255,253,247,.86); border: 1px solid var(--line); }
      th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
      th { color: var(--muted); font-size: 13px; background: rgba(255,250,240,.9); }
      .mini-ball { display: inline-block; margin: 2px; padding: 4px 8px; color: #fff; background: var(--red); font-weight: 800; }
      @media (max-width: 860px) {
        .topbar, .hero, .workspace { display: block; }
        .nav, .summary, .result, .history { margin-top: 14px; }
        .detail-grid { grid-template-columns: 1fr; }
        .history-head { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">今彩539</div>
        <nav class="nav" aria-label="主功能">
          <a href="/history.html">歷史記錄</a>
          <a class="active" href="/predict.html">預測開獎</a>
          <a href="/manual.html">手動輸入</a>
        </nav>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">Prediction Lab</p>
          <h1>預測號碼工作台</h1>
        </div>
        <p class="summary">選擇分析模式後產生五個參考號碼，並在同頁保留本次瀏覽的預測記錄。</p>
      </section>

      <section class="workspace">
        <aside class="panel control">
          <label>
            預測方式
            <select id="predictType" onchange="changePredictType()">
              <option value="ai">AI智能預測</option>
              <option value="frequency">頻率分析</option>
              <option value="cold">冷熱分析</option>
              <option value="trend">走勢分析</option>
              <option value="markov">馬可夫預測</option>
              <option value="cooccurrence">共現矩陣預測</option>
              <option value="pattern">版路分析預測</option>
              <option value="balanced">均衡分佈預測</option>
              <option value="ensemble">整合策略預測</option>
            </select>
          </label>
          <button onclick="generatePrediction()">生成預測號碼</button>
        </aside>

        <section class="panel result" id="predictionResult" aria-live="polite">
          <div class="result-head">
            <h2>預測結果</h2>
            <span class="meta" id="predictTime"></span>
          </div>
          <div class="balls" id="predictNumbers"></div>
          <p class="model-note" id="modelNote"></p>
          <div class="detail-grid">
            <div class="detail"><span>預測期次</span><strong id="predictPeriod"></strong></div>
            <div class="detail"><span>預測方式</span><strong id="predictMethod"></strong></div>
            <div class="detail"><span>資料期數</span><strong id="sampleSize">0</strong></div>
          </div>
        </section>
      </section>

      <section class="history">
        <div class="history-head">
          <h3>歷史預測記錄</h3>
          <button class="secondary" onclick="exportToCSV()">匯出CSV</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>期次</th>
              <th>預測號碼</th>
              <th>方式</th>
              <th>時間</th>
            </tr>
          </thead>
          <tbody id="predictionList"></tbody>
        </table>
      </section>
    </main>

    <script>
      function changePredictType() {
        // 目前只回傳選取值，保留給日後依模式切換說明或參數。
        return document.getElementById('predictType').value;
      }

      function generatePrediction() {
        // 預測邏輯集中在後端；前端只傳分析模式並負責渲染結果。
        var type = document.getElementById('predictType').value;
        fetch('/api/predict?type=' + encodeURIComponent(type))
          .then(function(response) {
            return response.json().then(function(data) {
              if (!response.ok || !data.success) throw new Error(data.message || '預測失敗');
              return data;
            });
          })
          .then(function(data) {
            var generatedAt = new Date(data.generated_at);
            document.getElementById('predictPeriod').textContent = data.period;
            document.getElementById('predictNumbers').innerHTML = data.numbers.map(function(n) {
              return '<span class="ball">' + n + '</span>';
            }).join('');
            document.getElementById('predictMethod').textContent = data.method;
            document.getElementById('predictTime').textContent = generatedAt.toLocaleString();
            document.getElementById('sampleSize').textContent = data.sample_size;
            document.getElementById('modelNote').textContent = data.description + ' 參考最近 ' + data.recent_window + ' 期與全部歷史資料。';
            document.getElementById('predictionResult').style.display = 'block';

            savePrediction(data.period, data.numbers, data.method, generatedAt);
          })
          .catch(function(error) {
            alert(error.message);
          });
      }

      function savePrediction(period, numbers, method, time) {
        // 預測記錄只保留在本次頁面 DOM 中，重新整理後不會寫入 lotto-539.db。
        var tbody = document.getElementById('predictionList');
        var tr = document.createElement('tr');
        var numberText = numbers.map(function(n) { return n.toString().padStart(2, '0'); }).join(',');
        tr.innerHTML = '<td>' + period + '</td>' +
                       '<td data-csv-value="' + numberText + '">' + numbers.map(function(n) { return '<span class="mini-ball">' + n.toString().padStart(2, '0') + '</span>'; }).join('') + '</td>' +
                       '<td>' + method + '</td>' +
                       '<td>' + time.toLocaleString() + '</td>';
        tbody.insertBefore(tr, tbody.firstChild);
      }

      function exportToCSV() {
        // 將目前表格內容整理成 CSV，再交給後端回傳下載檔。
        var rows = document.querySelectorAll('#predictionList tr');
        if (rows.length === 0) {
          alert('沒有資料可匯出');
          return;
        }
        var csvContent = '\uFEFF期次,預測號碼,方式,時間\n';
        rows.forEach(function(row) {
          var cols = row.querySelectorAll('td');
          var rowData = [];
          cols.forEach(function(col) {
            // CSV 欄位用雙引號包起來；原本的雙引號需轉成兩個雙引號。
            var value = col.getAttribute('data-csv-value') || col.textContent;
            rowData.push('"' + value.replace(/"/g, '""') + '"');
          });
          csvContent += rowData.join(',') + '\n';
        });

        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/api/export-csv';
        form.style.display = 'none';

        var input = document.createElement('textarea');
        input.name = 'csvContent';
        input.value = csvContent;
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
      }
    </script>
  </body>
</html>
