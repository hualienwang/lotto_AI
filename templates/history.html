<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>今彩539歷次開獎記錄</title>
    <meta content="今彩539,開獎記錄,歷史開獎" name="keywords" />
    <meta name="Description" content="今彩539歷次開獎記錄查詢，可以查看所有開獎期數和號碼分佈。" />
    <style>
      :root {
        --ink: #211f18;
        --muted: #746e61;
        --paper: #fffaf0;
        --panel: #fffdf7;
        --line: #ded3bb;
        --gold: #d6a23a;
        --red: #d84a3a;
        --green: #0d7c66;
        --blue: #305f89;
        --shadow: 0 24px 70px rgba(33,31,24,.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        background:
          linear-gradient(135deg, rgba(214,162,58,.18), transparent 34%),
          radial-gradient(circle at 88% 10%, rgba(13,124,102,.13), transparent 28%),
          var(--paper);
      }
      .shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 56px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
      .brand { font: 700 18px/1 "Noto Serif TC", "PMingLiU", serif; }
      .nav { display: flex; flex-wrap: wrap; gap: 8px; }
      .nav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 9px 12px; background: rgba(255,255,255,.5); }
      .nav a.active, .nav a:hover { color: var(--ink); border-color: var(--gold); }
      .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 28px; align-items: end; padding: 44px 0 28px; }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font: 800 clamp(38px, 7vw, 76px)/.98 "Noto Serif TC", "PMingLiU", serif; letter-spacing: 0; }
      .summary { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
      .toolbar {
        display: grid;
        grid-template-columns: minmax(180px, 240px) 1fr auto;
        gap: 12px;
        align-items: end;
        padding: 18px;
        background: rgba(255,253,247,.88);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 800; }
      .range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      select, input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 10px 12px;
        font: 700 15px/1.2 "Microsoft JhengHei", sans-serif;
        outline: none;
      }
      select:focus, input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(13,124,102,.12); }
      button {
        min-height: 44px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        padding: 0 18px;
        font-weight: 800;
        cursor: pointer;
      }
      .selected-strip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }
      .selected-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }
      .panel { background: rgba(255,253,247,.88); border: 1px solid var(--line); box-shadow: var(--shadow); margin-top: 18px; }
      .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 18px; border-bottom: 1px solid var(--line); }
      h2 { margin: 0; font: 800 24px/1.2 "Noto Serif TC", "PMingLiU", serif; }
      .meta { color: var(--muted); font-size: 13px; }
      .number-grid {
        display: grid;
        grid-template-columns: 7.5% 8.5% repeat(39, minmax(0, 1fr));
        gap: 0;
        padding: 18px 0;
      }
      .number-grid::before {
        content: "";
        grid-column: span 2;
      }
      .pick {
        min-height: 38px;
        min-width: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 0;
        font-weight: 900;
        font-size: clamp(7px, .8vw, 12px);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .pick.selected, .chip {
        color: #fff;
        border-color: var(--red);
        background: var(--red);
      }
      .chip {
        display: inline-grid;
        place-items: center;
        min-width: 32px;
        min-height: 32px;
        padding: 0 8px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      .table-wrap { overflow-x: hidden; overflow-y: visible; }
      table { width: 100%; border-collapse: collapse; }
      .trend-table {
        table-layout: fixed;
        min-width: 0;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 10px 8px;
        text-align: center;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .trend-table th,
      .trend-table td {
        padding: 7px 1px;
        overflow: hidden;
        text-overflow: clip;
      }
      .trend-table th:nth-child(1),
      .trend-table td:nth-child(1) { width: 7.5%; }
      .trend-table th:nth-child(2),
      .trend-table td:nth-child(2) { width: 8.5%; }
      th { color: var(--muted); font-size: 12px; background: rgba(255,250,240,.92); position: sticky; top: 0; z-index: 1; }
      .trend-table th { font-size: clamp(7px, .82vw, 12px); }
      .trend-table td { font-size: clamp(7px, .8vw, 12px); }
      tbody tr:hover { background: rgba(214,162,58,.08); }
      .hit {
        display: inline-grid;
        place-items: center;
        width: min(24px, 1.82vw);
        height: min(24px, 1.82vw);
        min-width: 10px;
        min-height: 10px;
        border-radius: 50%;
        color: #fff;
        background: var(--red);
        font-weight: 900;
        font-size: clamp(6px, .72vw, 11px);
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 7.5% 8.5% repeat(39, minmax(0, 1fr));
        align-items: end;
        overflow: hidden;
        border-top: 1px solid var(--line);
      }
      .stat-spacer {
        min-height: 92px;
        display: grid;
        place-items: end center;
        color: var(--muted);
        border-right: 1px solid rgba(222,211,187,.7);
        border-bottom: 1px solid var(--line);
        padding: 8px 2px;
        font-size: clamp(7px, .82vw, 12px);
        font-weight: 800;
      }
      .stat-title {
        grid-column: span 2;
        padding: 8px 6px;
        text-align: center;
        line-height: 1.35;
      }
      .sorted-grid {
        border-top: 0;
        border-bottom: 1px solid var(--line);
      }
      .rank-cell {
        min-height: 50px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 3px;
        border: 0;
        border-right: 1px solid rgba(222,211,187,.55);
        background: rgba(255,255,255,.78);
        padding: 6px 1px;
        color: var(--ink);
        cursor: pointer;
      }
      .rank-cell strong {
        color: var(--red);
        font-size: clamp(8px, .86vw, 13px);
        line-height: 1;
      }
      .rank-cell span {
        color: var(--muted);
        font-size: clamp(7px, .72vw, 10px);
        font-weight: 800;
        line-height: 1;
      }
      .stat {
        min-height: 92px;
        display: grid;
        align-content: end;
        justify-items: center;
        gap: 4px;
        border: 0;
        border-right: 1px solid rgba(222,211,187,.55);
        border-bottom: 1px solid var(--line);
        background: #fff;
        padding: 8px 1px;
      }
      .bar {
        width: min(12px, 1vw);
        min-height: 4px;
        background: linear-gradient(var(--red), var(--gold));
      }
      .stat strong {
        font-size: clamp(7px, .8vw, 12px);
        line-height: 1;
        color: var(--ink);
      }
      .empty { padding: 28px; color: var(--muted); text-align: center; }
      @media (max-width: 840px) {
        .topbar, .hero, .toolbar { display: block; }
        .nav, .summary, .range, .toolbar button { margin-top: 14px; }
        .number-grid { grid-template-columns: 8.5% 9.5% repeat(39, minmax(0, 1fr)); }
        .panel-head { display: block; }
        .meta { display: block; margin-top: 8px; }
        .trend-table th,
        .trend-table td { padding: 5px 0; }
        .trend-table th:nth-child(1),
        .trend-table td:nth-child(1) { width: 8.5%; }
        .trend-table th:nth-child(2),
        .trend-table td:nth-child(2) { width: 9.5%; }
        .stat-grid { grid-template-columns: 8.5% 9.5% repeat(39, minmax(0, 1fr)); }
        .stat, .stat-spacer { min-height: 64px; padding-left: 0; padding-right: 0; }
        .stat-title { padding-left: 2px; padding-right: 2px; }
        .rank-cell { min-height: 42px; }
        .bar { width: 5px; }
        .hit {
          width: min(14px, 2vw);
          height: min(14px, 2vw);
          min-width: 7px;
          min-height: 7px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">今彩539</div>
        <nav class="nav" aria-label="主功能">
          <a class="active" href="/history.html">歷史記錄</a>
          <a href="/predict.html">預測開獎</a>
          <a href="/manual.html">手動輸入</a>
        </nav>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">History Matrix</p>
          <h1>歷次開獎記錄</h1>
        </div>
        <p class="summary">查看指定期數的開獎分布，點選 01-39 可標記最多五個觀察號碼，並同步查看開出次數排序。</p>
      </section>

      <section class="toolbar" aria-label="查詢條件">
        <label>
          快捷查詢
          <select id="quickSelect" onchange="loadQuick(this.value)">
            <option value="10">最近10期</option>
            <option value="30" selected>最近30期</option>
            <option value="50">最近50期</option>
            <option value="100">最近100期</option>
          </select>
        </label>
        <div class="range">
          <label>
            起始期次
            <input id="p1" maxlength="10" name="p1" placeholder="例：115001" />
          </label>
          <label>
            結束期次
            <input id="p2" maxlength="10" name="p2" placeholder="例：115088" />
          </label>
        </div>
        <button onclick="searchByPeriod()">查詢</button>
      </section>

      <div class="selected-strip">
        <span>已標記</span>
        <div class="selected-list" id="selectedList"></div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>選號區</h2>
          <span class="meta">最多選取 5 個號碼</span>
        </div>
        <div class="number-grid" id="numberPicker"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>分布走勢</h2>
          <span class="meta" id="resultLabel">載入中</span>
        </div>
        <div class="stat-grid" id="rankBody"></div>
        <div class="table-wrap">
          <table class="trend-table">
            <thead id="historyHead"></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
        <div class="stat-grid sorted-grid" id="sortedRankBody"></div>
      </section>
    </main>

    <script>
      // 頁面狀態：使用 Set 記住被標記的號碼，用物件記住目前查詢結果的開出次數。
      var selectedNumbers = new Set();
      var numberCounts = {};

      function two(n) {
        // 今彩539顯示固定兩位數，例如 1 顯示為 01。
        return n.toString().padStart(2, '0');
      }

      function buildPicker() {
        // 建立 01-39 的選號按鈕；點擊後只更新標記狀態，不會改動資料庫。
        var picker = document.getElementById('numberPicker');
        picker.innerHTML = '';
        for (var i = 1; i <= 39; i++) {
          var num = two(i);
          var button = document.createElement('button');
          button.className = 'pick';
          button.type = 'button';
          button.textContent = num;
          button.setAttribute('data-num', num);
          button.onclick = function() { toggleNumber(this.getAttribute('data-num')); };
          picker.appendChild(button);
        }
      }

      function toggleNumber(num) {
        // 最多標記 5 個號碼；已選號碼再次點擊會取消。
        if (selectedNumbers.has(num)) {
          selectedNumbers.delete(num);
        } else if (selectedNumbers.size < 5) {
          selectedNumbers.add(num);
        }
        syncSelectedUI();
      }

      function syncSelectedUI() {
        // 將 selectedNumbers 同步到按鈕樣式與「已標記」清單。
        document.querySelectorAll('.pick').forEach(function(button) {
          button.classList.toggle('selected', selectedNumbers.has(button.getAttribute('data-num')));
        });
        var list = document.getElementById('selectedList');
        var items = Array.from(selectedNumbers).sort();
        list.innerHTML = items.length
          ? items.map(function(num) { return '<span class="chip">' + num + '</span>'; }).join('')
          : '<span>尚未標記</span>';
      }

      function loadQuick(count) {
        // 快捷查詢使用 limit，只向後端要求最近 N 期。
        document.getElementById('resultLabel').textContent = '載入最近 ' + count + ' 期';
        fetch('/api/history?limit=' + encodeURIComponent(count))
          .then(function(r) { return r.json(); })
          .then(function(data) { renderHistory(data, '最近 ' + count + ' 期'); });
      }

      function searchByPeriod() {
        // 區間查詢使用 start/end；後端會以 period 欄位篩選。
        var p1 = document.getElementById('p1').value.trim();
        var p2 = document.getElementById('p2').value.trim();
        var label = p1 && p2 ? p1 + ' - ' + p2 + ' 期' : '指定期次';
        fetch('/api/history?start=' + encodeURIComponent(p1) + '&end=' + encodeURIComponent(p2))
          .then(function(r) { return r.json(); })
          .then(function(data) { renderHistory(data, label); });
      }

      function renderHistory(data, label) {
        // 核心渲染流程：重建表頭、清空舊資料、重新統計每個號碼出現次數。
        var head = document.getElementById('historyHead');
        var tbody = document.getElementById('historyBody');
        head.innerHTML = '<tr><th>期次</th><th>開獎日</th>' +
          Array.from({length: 39}, function(_, idx) { return '<th>' + two(idx + 1) + '</th>'; }).join('') +
          '</tr>';
        tbody.innerHTML = '';
        numberCounts = {};
        for (var i = 1; i <= 39; i++) numberCounts[i] = 0;

        if (!data.length) {
          tbody.innerHTML = '<tr><td class="empty" colspan="41">沒有符合條件的資料</td></tr>';
          document.getElementById('resultLabel').textContent = label + '，共 0 筆';
          renderRanking();
          renderSortedNumbers();
          return;
        }

        data.forEach(function(row) {
          // numbers 可能以空白或逗號分隔，前端轉成兩位數陣列以便比對 01-39 欄位。
          var nums = row.numbers
            .split(/[\s,，]+/)
            .filter(function(n) { return n.trim().length > 0; })
            .map(function(n) { return n.trim().padStart(2, '0'); });
          nums.forEach(function(n) {
            var num = parseInt(n, 10);
            if (num >= 1 && num <= 39) numberCounts[num]++;
          });

          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + row.period + '</td><td>' + row.draw_date + '</td>';
          for (var i = 1; i <= 39; i++) {
            var num = two(i);
            tr.innerHTML += nums.indexOf(num) >= 0 ? '<td><span class="hit">' + num + '</span></td>' : '<td></td>';
          }
          tbody.appendChild(tr);
        });

        document.getElementById('resultLabel').textContent = label + '，共 ' + data.length + ' 筆';
        renderRanking();
        renderSortedNumbers();
      }

      function renderRanking() {
        // 依目前查詢資料畫出每個號碼的開出次數長條。
        var rankBody = document.getElementById('rankBody');
        rankBody.innerHTML = '';
        var counts = [];
        for (var i = 1; i <= 39; i++) counts.push({num: i, count: numberCounts[i] || 0});
        var maxCount = counts.reduce(function(max, item) { return Math.max(max, item.count); }, 0);

        rankBody.innerHTML = '<div class="stat-spacer stat-title">開出次數排序</div>';
        counts.forEach(function(item) {
          var height = maxCount > 0 && item.count > 0 ? Math.max(4, Math.round(item.count * 48 / maxCount)) : 0;
          var bar = item.count > 0 ? '<div class="bar" style="height:' + height + 'px"></div>' : '';
          var div = document.createElement('button');
          div.type = 'button';
          div.className = 'stat';
          div.onclick = function() { toggleNumber(two(item.num)); };
          div.innerHTML = '<strong>' + item.count + '</strong>' + bar;
          rankBody.appendChild(div);
        });
      }

      function renderSortedNumbers() {
        // 依開出次數由高到低排序；次數相同時用號碼小者排前。
        var sortedRankBody = document.getElementById('sortedRankBody');
        sortedRankBody.innerHTML = '';
        var sorted = [];
        for (var i = 1; i <= 39; i++) sorted.push({num: i, count: numberCounts[i] || 0});
        sorted.sort(function(a, b) { return b.count - a.count || a.num - b.num; });

        sortedRankBody.innerHTML = '<div class="stat-spacer stat-title">統計次數號碼</div>';
        sorted.forEach(function(item) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'rank-cell';
          button.onclick = function() { toggleNumber(two(item.num)); };
          button.innerHTML = '<strong>' + two(item.num) + '</strong><span>' + item.count + '</span>';
          sortedRankBody.appendChild(button);
        });
      }

      // 頁面初始化：先建立選號器，再載入預設最近 30 期資料。
      buildPicker();
      syncSelectedUI();
      loadQuick(30);
    </script>
  </body>
</html>
